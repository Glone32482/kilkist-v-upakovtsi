<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Перевірка кількості в упаковці</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap">
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
:root {
  --wu: #ffd400;
  --wu-soft: #fff6c2;
  --ink: #1c1c1e;
  --ink-2: #4a4a4f;
  --ink-3: #8a8a90;
  --hero: #1c1c1e;
  --hero-2: #2a2a2d;
  --hero-line: #4a4a4f;
  --hero-text: #b8b8bd;
  --bg: #f5f5f2;
  --card: #ffffff;
  --line: #e7e6e1;
  --bad: #d93a2b;
  --bad-soft: #fdecea;
  --ok: #1f9d55;
  --ok-soft: #e8f6ee;
  --warn: #b7791f;
  --warn-soft: #fdf3e1;
  --kept: #eeeeea;
  --shadow: 0 1px 2px rgba(28, 28, 30, .06), 0 8px 24px rgba(28, 28, 30, .06);
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-padding-top: 140px; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 "Onest", system-ui, sans-serif; font-variant-numeric: tabular-nums; }
h1, h2, p { margin: 0; }
button, input { font: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.wrap { max-width: 1600px; margin: 0 auto; padding: 0 32px; }
mark { background: var(--wu); color: var(--ink); padding: 0 3px; border-radius: 4px; font-weight: 600; }
.muted { color: var(--ink-3); }

.btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font-weight: 600; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--ink-3); }
.btn.wu { background: var(--wu); border-color: var(--wu); }
.btn.wu:hover { filter: brightness(.97); }
.link { padding: 0; border: none; background: none; color: var(--ink-2); font-weight: 500; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.link:hover { color: var(--ink); }

/* Шапка: завантаження і зведення */
.hero { background: var(--hero); color: #fff; padding: 22px 0 26px; }
.hero-top { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; }
.hero-top h1 { font-size: 19px; font-weight: 700; }
.tag { padding: 3px 10px; border-radius: 999px; background: var(--wu); color: var(--ink); font-weight: 800; font-size: 12px; }
.hero-top .spacer { flex: 1; }
.hero-grid { display: grid; grid-template-columns: minmax(300px, 1.1fr) 2fr; gap: 18px; }

.drop { position: relative; display: grid; gap: 8px; align-content: center; min-height: 128px; padding: 18px 20px; border: 2px dashed var(--hero-line); border-radius: 14px; cursor: pointer; }
.drop:hover, .drop.over { border-color: var(--wu); }
.drop.over { background: rgba(255, 212, 0, .08); }
.drop b { font-size: 15px; }
.drop .hint { color: var(--hero-text); }
.drop .file-name { color: #fff; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.drop .error { color: #ff9c90; }
.progress { height: 6px; border-radius: 999px; background: #3a3a3f; overflow: hidden; }
.progress span { display: block; height: 100%; width: 0; background: var(--wu); transition: width .2s; }
.progress.busy span { width: 35%; animation: slide 1.1s ease-in-out infinite; }
@keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(300%); } }
@media (prefers-reduced-motion: reduce) { .progress.busy span { animation: none; width: 100%; opacity: .5; } }

.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.kpi { display: grid; align-content: start; gap: 2px; padding: 16px 18px; border: none; border-radius: 14px; background: var(--hero-2); color: #fff; text-align: left; cursor: pointer; }
.kpi:disabled { cursor: default; }
.kpi:not(:disabled):hover { outline: 2px solid var(--hero-line); }
.kpi[aria-pressed="true"] { outline: 2px solid #fff; }
.kpi span { color: var(--hero-text); font-weight: 500; }
.kpi b { font-size: 30px; font-weight: 700; letter-spacing: -.02em; line-height: 1.25; }
.kpi small { color: #8a8a90; }
.kpi.main { background: var(--wu); color: var(--ink); }
.kpi.main span, .kpi.main small { color: var(--ink-2); }
.kpi.main[aria-pressed="true"] { outline-color: var(--wu-soft); outline-offset: 2px; }

/* Меню експорту */
.menu { position: relative; }
.menu summary { list-style: none; }
.menu summary::-webkit-details-marker { display: none; }
.menu-list { position: absolute; right: 0; top: calc(100% + 8px); z-index: 20; width: 340px; padding: 8px; border-radius: 14px; background: var(--card); color: var(--ink); box-shadow: 0 12px 40px rgba(0,0,0,.25); }
.menu-list button, .menu-list label { display: block; width: 100%; padding: 10px 12px; border: none; border-radius: 10px; background: none; text-align: left; cursor: pointer; }
.menu-list button:hover, .menu-list label:hover { background: var(--bg); }
.menu-list b { display: block; font-weight: 600; }
.menu-list small { color: var(--ink-3); }
.menu-list hr { border: none; border-top: 1px solid var(--line); margin: 6px 4px; }
.menu-list .danger { color: var(--bad); }

/* Список результатів */
.body { padding: 22px 0 64px; }
.listhead { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 14px 0 6px; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; margin-bottom: 14px; }
.toolbar .segments { flex: 1 1 100%; }
.segments { display: flex; flex-wrap: wrap; gap: 2px; padding: 4px; border-radius: 12px; background: var(--card); box-shadow: var(--shadow); }
.segments button { padding: 7px 11px; border: none; border-radius: 9px; background: none; color: var(--ink-2); font-weight: 500; cursor: pointer; }
.segments button:hover { color: var(--ink); }
.segments button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.segments em { font-style: normal; opacity: .65; margin-left: 4px; }
.toolbar .spacer { flex: 1; }
.search { width: 280px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
.check { display: inline-flex; align-items: center; gap: 8px; color: var(--ink-2); font-weight: 500; cursor: pointer; }
.check input { width: 16px; height: 16px; accent-color: var(--ink); }

.grid { display: grid; grid-template-columns: 96px minmax(240px, 1fr) 184px 256px 156px; gap: 16px; align-items: center; }
.colhead { padding: 0 18px 8px; color: var(--ink-3); font-size: 12px; font-weight: 600; }
.colhead button { padding: 0; border: none; background: none; color: inherit; font-weight: 600; cursor: pointer; text-align: left; }
.colhead button:hover { color: var(--ink); }
.colhead button[data-dir]::after { content: " ↑"; color: var(--ink); }
.colhead button[data-dir="desc"]::after { content: " ↓"; }

.items { display: grid; gap: 10px; }
.item { padding: 14px 18px; border-radius: 14px; background: var(--card); box-shadow: var(--shadow); }
.item.s-bad { background: linear-gradient(90deg, var(--bad-soft), var(--card) 38%); }
.item.s-ok, .item.s-fixed { background: linear-gradient(90deg, var(--ok-soft), var(--card) 38%); }
.item.s-structure, .item.s-check { background: linear-gradient(90deg, var(--warn-soft), var(--card) 38%); }
.item.s-kept { background: var(--kept); box-shadow: none; }
.item.flash { animation: flash .7s ease-out; }
@keyframes flash { from { box-shadow: 0 0 0 3px var(--wu); } }
@media (prefers-reduced-motion: reduce) { .item.flash { animation: none; } }

.c-id a { display: inline-flex; align-items: center; gap: 5px; color: var(--ink-2); font-weight: 600; text-decoration: none; padding: 4px 8px; margin-left: -8px; border-radius: 8px; }
.c-id a:hover { background: var(--wu-soft); color: var(--ink); }
.c-id svg { width: 12px; height: 12px; flex: none; }
.c-name .name { font-weight: 500; }
.c-name .fallback { color: var(--ink-3); }
.c-name .meta { margin-top: 3px; color: var(--ink-3); font-size: 12px; }
.vals { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 6px; font-weight: 700; font-size: 18px; white-space: nowrap; }
.vals small { font-size: 12px; font-weight: 500; color: var(--ink-3); white-space: normal; }
.vals .arrow { color: var(--ink-3); font-weight: 500; }
.vals .was { color: var(--ink); }
.s-bad .vals .was { color: var(--bad); }
.s-ok .vals .was { color: var(--ok); }
.s-structure .vals .was, .s-check .vals .was { color: var(--warn); }
.vals-label { display: block; margin-top: 2px; font-size: 11px; font-weight: 500; color: var(--ink-3); }

.eq { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.eq input { width: 64px; padding: 8px; border: 1px solid var(--line); border-radius: 9px; background: var(--card); font-weight: 600; text-align: right; }
.eq input:hover { border-color: var(--ink-3); }
.eq input:focus { border-color: var(--ink); outline: none; box-shadow: 0 0 0 3px var(--wu-soft); }
.eq .op { color: var(--ink-3); }
.eq output { min-width: 48px; font-size: 18px; font-weight: 700; text-align: right; }
.eq output.ok { color: var(--ok); }
.eq output.bad { color: var(--bad); }
.c-edit .before { margin-top: 4px; font-size: 12px; color: var(--ink-3); }

.c-status { display: grid; justify-items: end; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.ok, .chip.fixed { background: var(--ok-soft); color: var(--ok); }
.chip.structure, .chip.check { background: var(--warn-soft); color: var(--warn); }
.chip.kept, .chip.none { background: #e7e6e1; color: var(--ink-2); }

.more { display: flex; justify-content: center; margin-top: 18px; }
.empty { padding: 56px 16px; border-radius: 14px; background: var(--card); box-shadow: var(--shadow); text-align: center; color: var(--ink-2); }
.empty b { display: block; font-size: 17px; color: var(--ink); margin-bottom: 6px; }

.toast { position: fixed; right: 24px; bottom: 24px; z-index: 30; max-width: 420px; padding: 12px 16px; border-radius: 12px; background: var(--ink); color: #fff; box-shadow: 0 12px 40px rgba(0,0,0,.25); }
.toast.error { background: var(--bad); }

@media (max-width: 1240px) {
  .grid { grid-template-columns: 90px minmax(220px, 1fr) 180px 250px; }
  .grid > .c-status { grid-column: 2 / -1; display: flex; justify-content: flex-start; align-items: center; gap: 12px; }
  .colhead .h-status { display: none; }
}
@media (max-width: 1100px) {
  .wrap { padding: 0 20px; }
  .hero-grid { grid-template-columns: 1fr; }
  .grid { grid-template-columns: 80px 1fr; }
  .grid > .c-vals, .grid > .c-edit { grid-column: 2; }
  .colhead { display: none; }
  .search { width: 100%; }
}
@media (max-width: 640px) {
  .kpis { grid-template-columns: 1fr 1fr; }
}
</style>
</head>
<body>
<header class="hero">
  <div class="wrap">
    <div class="hero-top">
      <span class="tag">WU</span>
      <h1>Перевірка кількості в упаковці</h1>
      <span class="spacer"></span>
      <details class="menu" id="export-menu">
        <summary class="btn wu">Експорт в Excel</summary>
        <div class="menu-list">
          <button data-export="import" disabled><b>Вивантаження для імпорту</b><small>Усе вивантаження, у виправлених товарів нові Кратність, У блістері й Кількість.</small></button>
          <button data-export="fixes" disabled><b>Звіт про виправлення</b><small>Що, де й коли виправлено: було, стало, посилання на товар.</small></button>
          <button data-export="report" disabled><b>Повний звіт перевірки</b><small>Зведення й усі товари, що потребують уваги, зі статусами.</small></button>
          <hr>
          <button data-export="save-edits"><b>Зберегти правки у файл</b><small>Резервна копія. Правки також зберігаються в цьому браузері.</small></button>
          <label><b>Завантажити правки з файлу</b><small>Додає правки з файлу .json до наявних.</small><input id="load-edits" type="file" accept=".json" hidden></label>
          <button data-export="clear-edits" class="danger"><b>Видалити всі правки</b></button>
        </div>
      </details>
    </div>

    <div class="hero-grid">
      <label class="drop" id="drop">
        <input id="file" type="file" accept=".xlsx,.xls,.csv" hidden>
        <b id="drop-title">Перетягніть сюди вивантаження з DWH</b>
        <span class="hint" id="drop-hint">Або натисніть, щоб вибрати файл .xlsx. Файл обробляється в цьому браузері й нікуди не надсилається.</span>
        <div class="progress" id="progress" hidden><span></span></div>
        <span class="error" id="drop-error" hidden></span>
      </label>
      <div class="kpis" id="kpis">
        <button class="kpi" data-segment="all" disabled><span>Усього товарів</span><b id="k-total">—</b><small id="k-total-note">у вивантаженні</small></button>
        <button class="kpi" data-segment="ok" disabled><span>Збігається</span><b id="k-ok">—</b><small>кількість як у назві</small></button>
        <button class="kpi main" data-segment="bad" disabled><span>Розбіжності</span><b id="k-bad">—</b><small id="k-bad-note">картка не збігається з назвою</small></button>
        <button class="kpi" data-segment="review" disabled><span>Перевірити вручну</span><b id="k-review">—</b><small id="k-review-note">інша структура або не розпізнано</small></button>
      </div>
    </div>
  </div>
</header>

<main class="body">
  <div class="wrap">
    <section class="empty" id="start">
      <b>Завантажте вивантаження, щоб побачити результати</b>
      Потрібні стовпці: ID эталонного товара, Название товара, Кратность, В блистере, Количество в упаковке, Название товара DWH.
    </section>

    <section id="results" hidden>
      <div class="listhead">
        <div class="toolbar">
          <div class="segments" id="segments"></div>
          <input class="search" id="search" type="search" placeholder="Пошук за ID або назвою" aria-label="Пошук">
          <label class="check"><input id="hide-done" type="checkbox"> Сховати оброблені</label>
          <span class="spacer"></span>
          <span class="muted" id="count"></span>
        </div>
        <div class="grid colhead" id="colhead">
          <button data-sort="id">ID</button>
          <button data-sort="name">Назва товару DWH</button>
          <button data-sort="card">Кількість: у картці → у назві</button>
          <span>Кратність × У блістері = Кількість</span>
          <button data-sort="status" class="h-status">Статус</button>
        </div>
      </div>
      <div class="items" id="items"></div>
      <div class="empty" id="nothing" hidden></div>
      <div class="more"><button class="btn" id="more" hidden></button></div>
    </section>
  </div>
</main>

<div class="toast" id="toast" role="status" hidden></div>

<script type="module">
/* === check:start ===
   Розбір кількості з «Названия товара DWH» і звірка рядка вивантаження.
   Повторює tool/packqty/parse.py і report.py. Збіг перевіряє tool/tests/parity.mjs,
   він вирізає код між мітками check:start і check:end. Правила: .wiki/decisions/parse-rules.md. */

export const LS_BAD = "ЛС_БАД";
export const PIECES = "НДС (шт.)";
export const PAIRS = "НДС (пары)";
export const UNPARSED = "Не распарсенные";
export const STRUCTURE = "Структура блистеров";

// В Python \w и \d понимают кириллицу, в JS без флага u — нет. Поэтому буквы через \p{L}.
const NUMBER_SIGN = /№\s*(\d+)/gu;
const BLISTERS = /\((\d+)\s+блистер[\p{L}\d_]*\s*[хx×]\s*(\d+)/u;
const PIECES_RE = /(?<=\s)(\d+)\s+шт/giu;
const PAIRS_RE = /(?<=\s)(\d+)\s+пар/giu;
const SIZE_BEFORE = /(размер|до)\s+$/iu;
const TIMES_BEFORE = /(\d+)\s*(?:[хx×]|(?:упаков[\p{L}\d_]*|шт\.?)\s+по)\s*$/u;
const PLUS_BEFORE = /(\d+)\s*\+\s*$/u;
const MAYBE_NOT_QUANTITY = /^(кольцо|тест)|сбор[\p{L}\d_]*\s*№/iu;
// У наборов и комплектов «№N» обычно номер, а не количество. Если N не равно количеству,
// это не ошибка: товар уходит в не распарсенные. Решение пользователя 2026-11-01.
const KIT = /^(набор|комплект)/iu;
export const KIT_RULE = "набор или комплект: № не количество";

// marks — где в названии стоит количество: пары [начало, конец] для подсветки в интерфейсе.
const parsed = (group, quantity, rule = "", others = [], marks = []) => ({ group, quantity, rule, others, marks });
const span = (m, start = m.index) => [start, m.index + m[0].length];

export function parse(dwhName) {
  const name = (dwhName ?? "").trim();
  if (name.includes("№")) {
    // «.*№» на «№», затем « \(.*» на «».
    const rest = name.slice(name.lastIndexOf("№") + 1).split(" (")[0].trim();
    if (/^\d+$/.test(rest)) {
      const signs = [...name.matchAll(NUMBER_SIGN)];
      const numbers = signs.map((m) => Number(m[1]));
      if (name.includes("+") && numbers.length > 1) {
        return parsed(LS_BAD, numbers.reduce((a, b) => a + b, 0), "сумма № через +", [], signs.map((m) => span(m)));
      }
      return parsed(LS_BAD, Number(rest), "№", [], [span(signs.at(-1))]);
    }
  }
  const pieces = parsePieces(name);
  if (pieces) return pieces;
  const pairs = [...name.matchAll(PAIRS_RE)].filter((m) => !SIZE_BEFORE.test(name.slice(0, m.index)));
  if (pairs.length) {
    const taken = Number(pairs.at(-1)[1]);
    return parsed(PAIRS, taken, "пар", otherNumbers(pairs, taken), [span(pairs.at(-1))]);
  }
  return parsed(UNPARSED, null);
}

function parsePieces(name) {
  const found = [...name.matchAll(PIECES_RE)];
  if (!found.length) return null;
  const last = found.at(-1);
  const taken = Number(last[1]);
  const before = name.slice(0, last.index);
  const times = before.match(TIMES_BEFORE);
  if (times) return parsed(PIECES, Number(times[1]) * taken, "произведение шт", [], [span(last, times.index)]);
  const plus = before.match(PLUS_BEFORE);
  if (plus) return parsed(PIECES, Number(plus[1]) + taken, "сумма шт через +", [], [span(last, plus.index)]);
  return parsed(PIECES, taken, "шт", otherNumbers(found, taken), [span(last)]);
}

const otherNumbers = (matches, taken) =>
  [...new Set(matches.map((m) => Number(m[1])))].filter((n) => n !== taken).sort((a, b) => a - b);

export function blisters(dwhName) {
  const m = (dwhName ?? "").match(BLISTERS);
  return m ? [Number(m[1]), Number(m[2])] : null;
}

// Где в названии «(3 блистера х 10»: для подсветки на вкладке «Структура блистеров».
export function blistersSpan(dwhName) {
  const name = (dwhName ?? "").trim();
  const m = name.match(BLISTERS);
  return m ? span(m) : null;
}

export function toNumber(value) {
  if (value === null || value === undefined || typeof value === "boolean") return null;
  if (typeof value === "number") return value;
  const text = String(value).trim().replace(",", ".");
  if (text === "") return null;
  const number = Number(text);
  return Number.isNaN(number) ? null : number;
}

const isEmpty = (value) => value === null || value === undefined || value === "";

// Строка выгрузки: { dwhName, multiple, blister, quantity } — значения ячеек как есть.
export function checkRow({ dwhName, multiple, blister, quantity }) {
  const name = isEmpty(dwhName) ? null : String(dwhName);
  const multipleNumber = toNumber(multiple);
  const quantityNumber = toNumber(quantity);
  let result = parse(name);
  if (result.group === LS_BAD && name && KIT.test(name.trim())
      && quantityNumber !== null && quantityNumber !== result.quantity) {
    result = parsed(UNPARSED, null, KIT_RULE);
  }
  const reason = reasonFor(result, name, quantity, blister);
  let structure = null;
  if (result.group !== UNPARSED && !reason) {
    const fromName = blisters(name);
    if (fromName && fromName[0] * fromName[1] === quantityNumber
        && (fromName[0] !== multipleNumber || fromName[1] !== toNumber(blister))) {
      structure = fromName;
    }
  }
  // Пустое количество при пустом «В блистере» — незаполненная карточка, это видно в сводке.
  const suspicious = result.group === UNPARSED && ((multipleNumber ?? 0) > 1 || (quantityNumber ?? 0) > 1);
  return { parsed: result, reason, structure, suspicious };
}

function reasonFor(result, name, quantity, blister) {
  if (result.group === UNPARSED) return null;
  const reasons = [];
  const number = toNumber(quantity);
  // Пары в выгрузке записаны и парами, и штуками: «50 пар» — это 50 или 100.
  const allowed = result.group === PAIRS ? [result.quantity, 2 * result.quantity] : [result.quantity];
  if (isEmpty(blister)) reasons.push("«В блистере» пустое");
  if (isEmpty(quantity)) reasons.push("«Количество в упаковке» пустое");
  else if (number === null) reasons.push(`«Количество в упаковке» не число: ${quantity}`);
  else if (!allowed.includes(number)) {
    reasons.push("не равно");
    if (result.rule === "№" && number === 1 && MAYBE_NOT_QUANTITY.test(name)) {
      reasons.push("возможно, №N — номер, а не количество");
    }
  }
  if (result.others.length) {
    reasons.push(`в названии есть ещё ${result.others.join(", ")}, взято последнее ${result.quantity}`);
  }
  return reasons.join("; ") || null;
}
/* === check:end === */

// ---------------------------------------------------------------- Інтерфейс

// Назви стовпців вивантаження DWH. Дані залишаються як у системі, російською.
const ID = "ID эталонного товара";
const NAME = "Название товара";
const MULTIPLE = "Кратность";
const BLISTER = "В блистере";
const QUANTITY = "Количество в упаковке";
const DWH_NAME = "Название товара DWH";
const REQUIRED = [ID, NAME, MULTIPLE, BLISTER, QUANTITY, DWH_NAME];
const ADMIN_URL = "https://apis-data.com/products/product/";
const EDITS_KEY = "packqty:edits";
const PAGE = 150;

const STATUS = {
  bad: "Розбіжність",
  structure: "Інша структура",
  check: "Перевірити",
  ok: "Збігається",
  none: "Не розпізнано",
  fixed: "Виправлено",
  kept: "Залишено як є",
};
const STATUS_ORDER = { bad: 0, structure: 1, check: 2, fixed: 3, kept: 4, ok: 5, none: 6 };
const SEGMENTS = [
  { key: "attention", label: "Потребують уваги", test: (c) => ["bad", "structure", "check"].includes(c.base) },
  { key: "bad", label: "Розбіжності", test: (c) => c.base === "bad" },
  { key: "review", label: "Перевірити вручну", test: (c) => c.base === "structure" || c.base === "check" },
  { key: "structure", label: "Інша структура", test: (c) => c.base === "structure" },
  { key: "check", label: "Не розпізнано", test: (c) => c.base === "check" },
  { key: "fixed", label: "Виправлені", test: (c) => state.edits[c.id] && !state.edits[c.id].keep },
  { key: "ok", label: "Збігається", test: (c) => c.base === "ok" },
  { key: "all", label: "Усі", test: () => true },
];

// Правка за ID еталонного товару: { multiple, blister, at } або { keep: true, at }.
const state = {
  fileName: "", header: [], at: {}, items: [], byId: new Map(), edits: loadEdits(),
  segment: "attention", sort: { key: "status", dir: "asc" }, shown: PAGE, busy: false,
};
const $ = (id) => document.getElementById(id);

function loadEdits() {
  try {
    return JSON.parse(localStorage.getItem(EDITS_KEY)) ?? {};
  } catch {
    return {};
  }
}

function saveEdits() {
  try {
    localStorage.setItem(EDITS_KEY, JSON.stringify(state.edits));
  } catch {
    // Сховище браузера недоступне. Правки живуть до закриття вкладки, їх можна зберегти у файл.
  }
}

let toastTimer;
function toast(text, { error = false } = {}) {
  const box = $("toast");
  box.textContent = text;
  box.className = error ? "toast error" : "toast";
  box.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { box.hidden = true; }, error ? 8000 : 4000);
}

// ---------------------------------------------------------------- Завантаження

$("file").addEventListener("change", (event) => {
  openFile(event.target.files[0]);
  event.target.value = "";
});

document.addEventListener("dragover", (event) => {
  event.preventDefault();
  $("drop").classList.add("over");
});
document.addEventListener("dragleave", (event) => {
  if (!event.relatedTarget) $("drop").classList.remove("over");
});
document.addEventListener("drop", (event) => {
  event.preventDefault();
  $("drop").classList.remove("over");
  openFile(event.dataTransfer.files[0]);
});

const nextFrame = () => new Promise((resolve) => setTimeout(resolve, 0));

function setProgress(share, title, hint) {
  const bar = $("progress");
  bar.hidden = false;
  bar.classList.toggle("busy", share === null);
  bar.firstElementChild.style.width = share === null ? "" : `${Math.round(share * 100)}%`;
  $("drop-title").textContent = title;
  $("drop-hint").textContent = hint;
}

async function openFile(file) {
  if (!file || state.busy) return;
  state.busy = true;
  $("drop-error").hidden = true;
  try {
    setProgress(null, `Читаю ${file.name}…`, "Великий файл читається кілька секунд.");
    await nextFrame();
    const book = XLSX.read(await file.arrayBuffer(), { type: "array" });
    const raw = XLSX.utils.sheet_to_json(book.Sheets[book.SheetNames[0]],
      { header: 1, defval: null, raw: true, blankrows: false });
    await load(file.name, raw);
  } catch (error) {
    const errorBox = $("drop-error");
    errorBox.textContent = `Файл ${file.name} не відкрився: ${error.message}.`;
    errorBox.hidden = false;
    if (state.items.length) showLoaded();
    else setProgress(0, "Перетягніть сюди вивантаження з DWH", "Або натисніть, щоб вибрати файл .xlsx.");
  } finally {
    state.busy = false;
  }
}

async function load(fileName, raw) {
  if (!raw.length) throw new Error("у ньому немає рядків");
  const header = raw[0].map((cell) => (cell === null ? "" : String(cell).trim()));
  const missing = REQUIRED.filter((name) => !header.includes(name));
  if (missing.length) throw new Error(`немає стовпців ${missing.join(", ")}`);
  const at = Object.fromEntries(REQUIRED.map((name) => [name, header.indexOf(name)]));
  const rows = raw.slice(1)
    .map((row) => header.map((_, i) => row[i] ?? null))
    .filter((row) => row.some((cell) => cell !== null && cell !== ""));
  const items = [];
  // Перевірка частинами, щоб сторінка не завмирала і смуга прогресу рухалась.
  for (let start = 0; start < rows.length; start += 3000) {
    for (const row of rows.slice(start, start + 3000)) items.push(makeItem(row, at));
    setProgress(items.length / rows.length, `Перевіряю ${fileName}`,
      `${items.length.toLocaleString("uk")} з ${rows.length.toLocaleString("uk")} товарів`);
    await nextFrame();
  }
  Object.assign(state, { fileName, header, at, items, byId: new Map(items.map((c) => [c.id, c])), shown: PAGE });
  showLoaded();
  render();
}

function makeItem(row, at) {
  const result = checkRow({ dwhName: row[at[DWH_NAME]], multiple: row[at[MULTIPLE]],
                            blister: row[at[BLISTER]], quantity: row[at[QUANTITY]] });
  const name = String(row[at[DWH_NAME]] ?? row[at[NAME]] ?? "").trim();
  return { row, id: String(row[at[ID]]), ...result, base: baseStatus(result),
           search: `${row[at[ID]]} ${name}`.toLowerCase() };
}

function baseStatus({ parsed: p, reason, structure, suspicious }) {
  if (p.group !== UNPARSED && reason) return "bad";
  if (structure) return "structure";
  if (suspicious) return "check";
  return p.group !== UNPARSED ? "ok" : "none";
}

function showLoaded() {
  setProgress(1, state.fileName, `${state.items.length.toLocaleString("uk")} товарів перевірено. Перетягніть інший файл, щоб замінити.`);
  $("start").hidden = true;
  $("results").hidden = false;
  for (const button of document.querySelectorAll("[data-export]")) button.disabled = false;
  for (const kpi of document.querySelectorAll(".kpi")) kpi.disabled = false;
}

// ---------------------------------------------------------------- Відображення

const status = (c) => {
  const edit = state.edits[c.id];
  if (!edit) return c.base;
  return edit.keep ? "kept" : "fixed";
};
const isDone = (c) => Boolean(state.edits[c.id]);

function render() {
  renderKpis();
  renderSegments();
  renderItems();
}

function renderKpis() {
  const count = (test) => state.items.filter(test).length;
  const bad = state.items.filter((c) => c.base === "bad");
  const review = state.items.filter((c) => c.base === "structure" || c.base === "check");
  $("k-total").textContent = state.items.length.toLocaleString("uk");
  $("k-ok").textContent = count((c) => c.base === "ok").toLocaleString("uk");
  $("k-bad").textContent = bad.length.toLocaleString("uk");
  $("k-review").textContent = review.length.toLocaleString("uk");
  const fixed = Object.values(state.edits).filter((e) => !e.keep).length;
  $("k-total-note").textContent = fixed ? `виправлено товарів: ${fixed}` : "у вивантаженні";
  $("k-bad-note").textContent = `оброблено ${bad.filter(isDone).length} з ${bad.length}`;
  $("k-review-note").textContent = `оброблено ${review.filter(isDone).length} з ${review.length}`;
  for (const kpi of document.querySelectorAll(".kpi")) {
    kpi.setAttribute("aria-pressed", String(kpi.dataset.segment === state.segment));
  }
}

function renderSegments() {
  $("segments").innerHTML = SEGMENTS.map(({ key, label, test }) =>
    `<button data-segment="${key}" aria-pressed="${key === state.segment}">${label}<em>${state.items.filter(test).length.toLocaleString("uk")}</em></button>`,
  ).join("");
  for (const button of document.querySelectorAll("#colhead [data-sort]")) {
    if (button.dataset.sort === state.sort.key) button.dataset.dir = state.sort.dir;
    else delete button.dataset.dir;
  }
}

function visibleItems() {
  const query = $("search").value.trim().toLowerCase();
  const hideDone = $("hide-done").checked;
  const segment = SEGMENTS.find((s) => s.key === state.segment);
  const list = state.items.filter((c) => segment.test(c)
    && (!hideDone || !isDone(c) || state.segment === "fixed")
    && (!query || c.search.includes(query)));
  const { key, dir } = state.sort;
  const value = {
    id: (c) => Number(c.id) || 0,
    name: (c) => c.search.slice(c.id.length + 1),
    card: (c) => toNumber(c.row[state.at[QUANTITY]]) ?? -1,
    status: (c) => STATUS_ORDER[status(c)],
  }[key];
  const sign = dir === "asc" ? 1 : -1;
  return list.sort((a, b) => {
    const x = value(a);
    const y = value(b);
    const order = typeof x === "string" ? x.localeCompare(y, "ru") : x - y;
    return order * sign || (Number(a.id) - Number(b.id));
  });
}

function renderItems() {
  const list = visibleItems();
  $("items").innerHTML = list.slice(0, state.shown).map(itemHtml).join("");
  const left = list.length - state.shown;
  $("count").textContent = `Знайдено: ${list.length.toLocaleString("uk")}`;
  $("more").hidden = left <= 0;
  $("more").textContent = `Показати ще ${Math.min(PAGE, left).toLocaleString("uk")} · залишилось ${left.toLocaleString("uk")}`;
  const nothing = $("nothing");
  nothing.hidden = list.length > 0;
  nothing.innerHTML = $("search").value.trim()
    ? "<b>Нічого не знайдено</b>Змініть запит або виберіть інший розділ."
    : $("hide-done").checked
      ? "<b>Усе оброблено</b>У цьому розділі не залишилось необроблених товарів."
      : "<b>Тут порожньо</b>У цьому розділі немає товарів.";
}

const LINK_ICON = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M4.5 2.5h5v5M9.5 2.5 3 9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>';

function itemHtml(c) {
  const { row } = c;
  const { at } = state;
  const s = status(c);
  const edit = state.edits[c.id];
  const fixed = edit && !edit.keep ? edit : null;
  const multiple = fixed ? fixed.multiple : row[at[MULTIPLE]];
  const blister = fixed ? fixed.blister : row[at[BLISTER]];
  const quantity = fixed ? fixed.multiple * fixed.blister : toNumber(row[at[QUANTITY]]);
  const meta = reasonText(c);
  return `<article class="item grid s-${s}" data-id="${escape(c.id)}">
    <div class="c-id"><a href="${ADMIN_URL}${encodeURIComponent(c.id)}" target="_blank" rel="noopener" title="Відкрити товар в адмінці">${escape(c.id)}${LINK_ICON}</a></div>
    <div class="c-name">
      <div class="name">${productHtml(c)}</div>
      ${meta ? `<div class="meta">${escape(meta)}</div>` : ""}
    </div>
    <div class="c-vals">${valsHtml(c)}</div>
    <div class="c-edit">
      <div class="eq">
        <input data-field="multiple" inputmode="numeric" aria-label="Кратність" value="${cell(multiple)}">
        <span class="op">×</span>
        <input data-field="blister" inputmode="numeric" aria-label="У блістері" value="${cell(blister)}">
        <span class="op">=</span>
        <output class="${verdict(c, quantity)}">${cell(quantity)}</output>
      </div>
      ${fixed ? `<div class="before">було ${cell(row[at[MULTIPLE]])} × ${cell(row[at[BLISTER]])} = ${cell(row[at[QUANTITY]])}, ${when(fixed.at)}</div>` : ""}
    </div>
    <div class="c-status">
      <span class="chip ${s}">${STATUS[s]}</span>
      ${edit
        ? '<button class="link" data-action="reset">Скасувати</button>'
        : '<button class="link" data-action="keep" title="Картка правильна, змінювати не треба">Залишити як є</button>'}
    </div>
  </article>`;
}

// Назва з маркером на кількості, яку знайшов розбір.
function productHtml(c) {
  const dwhName = c.row[state.at[DWH_NAME]];
  if (dwhName === null || dwhName === "") {
    return `<span class="fallback">Немає назви DWH. ${escape(c.row[state.at[NAME]] ?? "")}</span>`;
  }
  const name = String(dwhName).trim();
  const marks = c.structure ? [blistersSpan(name)] : c.parsed.marks;
  let html = "";
  let from = 0;
  for (const [start, end] of [...marks].sort((a, b) => a[0] - b[0])) {
    html += `${escape(name.slice(from, start))}<mark>${escape(name.slice(start, end))}</mark>`;
    from = end;
  }
  return html + escape(name.slice(from));
}

// «У картці → у назві». Без числа в назві показуємо лише картку.
function valsHtml(c) {
  const { row } = c;
  const { at } = state;
  const card = cell(row[at[QUANTITY]]);
  const fromName = c.parsed.quantity;
  if (c.structure) {
    return `<div class="vals"><span class="was">${cell(row[at[MULTIPLE]])} × ${cell(row[at[BLISTER]])}</span><span class="arrow">→</span>${c.structure[0]} × ${c.structure[1]}</div><span class="vals-label">блістери: у картці → у назві</span>`;
  }
  if (fromName === null) {
    return `<div class="vals"><span class="was">${card || "—"}</span><small>у назві кількості немає</small></div>`;
  }
  const same = c.base === "ok";
  const unit = c.parsed.group === PAIRS ? ` <small>пар (${fromName} або ${2 * fromName} шт)</small>` : "";
  return `<div class="vals"><span class="was">${card || "—"}</span><span class="arrow">${same ? "=" : "→"}</span>${fromName}${unit}</div>`;
}

// ok — кількість картки збігається з назвою, bad — ні. Без числа в назві порівнювати нема з чим.
function verdict(c, quantity) {
  const fromName = c.parsed.quantity;
  if (fromName === null || quantity === null) return "";
  const ok = quantity === fromName || (c.parsed.group === PAIRS && quantity === 2 * fromName);
  return ok ? "ok" : "bad";
}

// Причини перевірка пише російською, як Python-еталон. Тут переклад для інтерфейсу.
const REASONS = [
  [/^не равно$/, ""],
  [/^«В блистере» пустое$/, "«У блістері» порожнє"],
  [/^«Количество в упаковке» пустое$/, "«Кількість в упаковці» порожня"],
  [/^«Количество в упаковке» не число: (.*)$/, "«Кількість в упаковці» не число: $1"],
  [/^возможно, №N — номер, а не количество$/, "можливо, №N — це номер, а не кількість"],
  [/^в названии есть ещё (.*), взято последнее (\d+)$/, "у назві є ще $1, взято останнє $2"],
];

function reasonText(c) {
  if (c.parsed.rule === KIT_RULE) return "Набір або комплект: №N у назві — це номер, а не кількість";
  if (c.structure) return `Кількість збігається, але блістери в картці не як у назві`;
  if (c.base === "check") return "Кількість у назві не знайдено, а в картці більше 1";
  if (!c.reason) return "";
  return c.reason.split("; ").map((part) => {
    const rule = REASONS.find(([pattern]) => pattern.test(part));
    return rule ? part.replace(rule[0], rule[1]) : part;
  }).filter(Boolean).join("; ");
}

const cell = (value) => (value === null || value === undefined ? "" : escape(value));
const escape = (value) => String(value).replace(/[&<>"]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[ch]);

function when(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return `${d.toLocaleDateString("uk")} ${d.toLocaleTimeString("uk", { hour: "2-digit", minute: "2-digit" })}`;
}

// Перемальовує один товар, а не список: фокус і прокрутка лишаються на місці.
// moveOn — після рішення перейти до Кратності наступного товару.
function updateItem(id, { moveOn = false } = {}) {
  renderKpis();
  renderSegments();
  const old = $("items").querySelector(`[data-id="${CSS.escape(id)}"]`);
  if (!old) return;
  old.insertAdjacentHTML("afterend", itemHtml(state.byId.get(id)));
  const fresh = old.nextElementSibling;
  old.remove();
  fresh.classList.add("flash");
  if (moveOn) fresh.nextElementSibling?.querySelector("input")?.focus();
}

// ---------------------------------------------------------------- Дії

function chooseSegment(key) {
  state.segment = key;
  state.shown = PAGE;
  render();
}

$("kpis").addEventListener("click", (event) => {
  const kpi = event.target.closest("[data-segment]");
  if (kpi && !kpi.disabled) chooseSegment(kpi.dataset.segment);
});

$("segments").addEventListener("click", (event) => {
  const button = event.target.closest("[data-segment]");
  if (button) chooseSegment(button.dataset.segment);
});

$("colhead").addEventListener("click", (event) => {
  const button = event.target.closest("[data-sort]");
  if (!button) return;
  const key = button.dataset.sort;
  state.sort = { key, dir: state.sort.key === key && state.sort.dir === "asc" ? "desc" : "asc" };
  state.shown = PAGE;
  render();
});

$("search").addEventListener("input", () => { state.shown = PAGE; renderItems(); });
$("hide-done").addEventListener("change", () => { state.shown = PAGE; renderItems(); });
$("more").addEventListener("click", () => { state.shown += PAGE; renderItems(); });

$("items").addEventListener("click", (event) => {
  const button = event.target.closest("[data-action]");
  if (!button) return;
  const id = button.closest(".item").dataset.id;
  const keep = button.dataset.action === "keep";
  if (keep) state.edits[id] = { keep: true, at: new Date().toISOString() };
  else delete state.edits[id];
  saveEdits();
  updateItem(id, { moveOn: keep });
});

// Поки людина друкує, результат перераховується без збереження.
$("items").addEventListener("input", (event) => {
  const item = event.target.closest(".item");
  if (!item) return;
  const [multiple, blister] = readEquation(item);
  const output = item.querySelector("output");
  const quantity = multiple !== null && blister !== null ? multiple * blister : null;
  output.textContent = quantity ?? "";
  output.className = verdict(state.byId.get(item.dataset.id), quantity);
});

// Правка зберігається, коли фокус виходить із товару, а не при переході між його полями.
$("items").addEventListener("focusout", (event) => {
  const item = event.target.closest(".item");
  if (item && event.target.matches("input") && !item.contains(event.relatedTarget)) commit(item);
});

$("items").addEventListener("keydown", (event) => {
  if (event.key !== "Enter" || !event.target.matches("input")) return;
  event.preventDefault();
  const item = event.target.closest(".item");
  if (event.target.dataset.field === "multiple") item.querySelector('[data-field="blister"]').focus();
  else if (commit(item, { moveOn: true }) === "same") item.nextElementSibling?.querySelector("input")?.focus();
});

const readEquation = (item) =>
  ["multiple", "blister"].map((field) => toNumber(item.querySelector(`[data-field="${field}"]`).value));

// Зберігає правку товару. Початкові значення в полях знімають правку.
function commit(item, { moveOn = false } = {}) {
  const c = state.byId.get(item.dataset.id);
  const [multiple, blister] = readEquation(item);
  const before = state.edits[c.id];
  const original = multiple === toNumber(c.row[state.at[MULTIPLE]]) && blister === toNumber(c.row[state.at[BLISTER]]);
  if (original) {
    if (!before || before.keep) return "same";
    delete state.edits[c.id];
  } else if (Number.isInteger(multiple) && Number.isInteger(blister) && multiple > 0 && blister > 0) {
    if (before && before.multiple === multiple && before.blister === blister) return "same";
    state.edits[c.id] = { multiple, blister, at: new Date().toISOString() };
  } else {
    toast(`ID ${c.id}: Кратність і У блістері мають бути цілими числами, більшими за нуль.`, { error: true });
    return "invalid";
  }
  saveEdits();
  updateItem(c.id, { moveOn });
  return "saved";
}

// ---------------------------------------------------------------- Експорт

document.addEventListener("click", (event) => {
  const menu = $("export-menu");
  if (menu.open && !menu.contains(event.target)) menu.open = false;
});

$("export-menu").addEventListener("click", (event) => {
  const button = event.target.closest("[data-export]");
  if (!button || button.disabled) return;
  $("export-menu").open = false;
  ({ import: exportImport, fixes: exportFixes, report: exportReport,
     "save-edits": saveEditsFile, "clear-edits": clearEdits })[button.dataset.export]();
});

$("load-edits").addEventListener("change", async (event) => {
  const file = event.target.files[0];
  event.target.value = "";
  $("export-menu").open = false;
  if (!file) return;
  try {
    const loaded = JSON.parse(await file.text());
    state.edits = { ...state.edits, ...loaded };
    saveEdits();
    if (state.items.length) render();
    toast(`Правки завантажено з файлу: ${Object.keys(loaded).length}.`);
  } catch (error) {
    toast(`Файл правок не прочитано: ${error.message}.`, { error: true });
  }
});

function today() {
  const d = new Date();
  return `${String(d.getDate()).padStart(2, "0")}.${String(d.getMonth() + 1).padStart(2, "0")}.${d.getFullYear()}`;
}

function download(blob, name) {
  const link = Object.assign(document.createElement("a"), { href: URL.createObjectURL(blob), download: name });
  link.click();
  setTimeout(() => URL.revokeObjectURL(link.href), 1000);
}

// Аркуш із клікабельним стовпцем посилань на товар в адмінці.
function sheet(header, rows, linkColumn = -1) {
  const ws = XLSX.utils.aoa_to_sheet([header, ...rows]);
  if (linkColumn >= 0) {
    rows.forEach((row, i) => {
      const cellRef = ws[XLSX.utils.encode_cell({ r: i + 1, c: linkColumn })];
      if (cellRef) cellRef.l = { Target: row[linkColumn] };
    });
  }
  return ws;
}

// Усе вивантаження у вихідному вигляді. У виправлених товарів замінено Кратность, В блистере і Количество.
function exportImport() {
  const { at } = state;
  let changed = 0;
  const rows = state.items.map(({ row, id }) => {
    const edit = state.edits[id];
    if (!edit || edit.keep) return row;
    changed += 1;
    const copy = [...row];
    copy[at[MULTIPLE]] = edit.multiple;
    copy[at[BLISTER]] = edit.blister;
    copy[at[QUANTITY]] = edit.multiple * edit.blister;
    return copy;
  });
  const book = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(book, sheet(state.header, rows), "Экспорт");
  const base = state.fileName.replace(/\.[^.]+$/, "");
  XLSX.writeFile(book, `${base} - з правками ${today()}.xlsx`, { compression: true });
  toast(`Вивантаження для імпорту завантажено. Змінено товарів: ${changed}.`);
}

// Що, де й коли виправлено. Окремий аркуш — товари, залишені як є.
function exportFixes() {
  const { at } = state;
  const fixedHeader = ["ID товару", "Посилання в адмінці", "Назва товару DWH", "Статус перевірки",
    "Кількість у назві", "Було: Кратність", "Було: У блістері", "Було: Кількість",
    "Стало: Кратність", "Стало: У блістері", "Стало: Кількість", "Коли виправлено"];
  const keptHeader = ["ID товару", "Посилання в адмінці", "Назва товару DWH", "Статус перевірки",
    "Кількість у назві", "Кратність", "У блістері", "Кількість", "Коли перевірено"];
  const fixedRows = [];
  const keptRows = [];
  for (const [id, edit] of Object.entries(state.edits)) {
    const c = state.byId.get(id);
    if (!c) continue;
    const head = [Number(id) || id, ADMIN_URL + id, productText(c), STATUS[c.base], c.parsed.quantity];
    const was = [c.row[at[MULTIPLE]], c.row[at[BLISTER]], c.row[at[QUANTITY]]];
    if (edit.keep) keptRows.push([...head, ...was, when(edit.at)]);
    else fixedRows.push([...head, ...was, edit.multiple, edit.blister, edit.multiple * edit.blister, when(edit.at)]);
  }
  if (!fixedRows.length && !keptRows.length) return toast("Правок ще немає, звіт порожній.", { error: true });
  const missing = Object.keys(state.edits).filter((id) => !state.byId.has(id)).length;
  const book = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(book, sheet(fixedHeader, fixedRows, 1), "Виправлено");
  XLSX.utils.book_append_sheet(book, sheet(keptHeader, keptRows, 1), "Залишено як є");
  XLSX.writeFile(book, `Звіт про виправлення - Аптека 9-1-1 - ${today()}.xlsx`, { compression: true });
  toast(`Звіт про виправлення завантажено: виправлено ${fixedRows.length}, залишено як є ${keptRows.length}.`
    + (missing ? ` Правок для товарів, яких немає в цьому файлі: ${missing}.` : ""));
}

const productText = (c) => String(c.row[state.at[DWH_NAME]] ?? c.row[state.at[NAME]] ?? "").trim();

// Повний звіт за регламентом: зведення й аркуш на кожен розділ, що потребує уваги.
function exportReport() {
  const added = ["Посилання в адмінці", "Кількість у назві", "Правило", "Причина",
    "Нова Кратність", "Нове У блістері", "Нова кількість", "Статус"];
  const book = XLSX.utils.book_new();
  const summary = [["Показник", "Кількість"], ["Товарів у вивантаженні", state.items.length]];
  const parts = [["Розбіжності", "bad"], ["Інша структура", "structure"], ["Перевірити вручну", "check"]];
  const sheets = parts.map(([title, base]) => {
    const list = state.items.filter((c) => c.base === base);
    summary.push([title, list.length], [`${title}: оброблено`, list.filter(isDone).length]);
    const rows = list.map((c) => {
      const edit = state.edits[c.id];
      const fixed = edit && !edit.keep ? [edit.multiple, edit.blister, edit.multiple * edit.blister] : [null, null, null];
      return [...c.row, ADMIN_URL + c.id, c.parsed.quantity, c.parsed.rule, reasonText(c), ...fixed, STATUS[status(c)]];
    });
    return [title, sheet([...state.header, ...added], rows, state.header.length)];
  });
  summary.push(["Збігається", state.items.filter((c) => c.base === "ok").length],
    ["Не розпізнано, кількість 0 або 1", state.items.filter((c) => c.base === "none").length]);
  XLSX.utils.book_append_sheet(book, XLSX.utils.aoa_to_sheet(summary), "Зведення");
  for (const [title, ws] of sheets) XLSX.utils.book_append_sheet(book, ws, title);
  XLSX.writeFile(book, `Невідповідність кількості в упаковці - Аптека 9-1-1 - ${today()}.xlsx`, { compression: true });
  toast("Повний звіт перевірки завантажено.");
}

function saveEditsFile() {
  download(new Blob([JSON.stringify(state.edits, null, 1)], { type: "application/json" }),
    `правки-кількість-в-упаковці-${today()}.json`);
  toast(`Правки збережено у файл: ${Object.keys(state.edits).length}.`);
}

function clearEdits() {
  const count = Object.keys(state.edits).length;
  if (!count) return toast("Правок немає.");
  if (!confirm(`Видалити всі правки (${count})? Якщо вони ще потрібні, спершу збережіть їх у файл.`)) return;
  state.edits = {};
  saveEdits();
  if (state.items.length) render();
  toast("Усі правки видалено.");
}
</script>
